[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "source-bundler"
version = "0.1.0"
description = "Deterministic local web source capture and packaging tool for AI workflows"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "playwright>=1.40.0",
    "beautifulsoup4>=4.12.0",
    "markdownify>=0.11.0",
    "readability-lxml>=0.8.1",
    "lxml>=4.9.0",
    "python-slugify>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
source-bundler = "source_bundler.cli:app"
